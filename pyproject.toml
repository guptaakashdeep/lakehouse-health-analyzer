[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakehouse-health-analyzer"
version = "0.1.0"
description = "A tool for analyzing lakehouse table health"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Akashdeep Gupta" }]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.26.0",
    "duckdb>=1.5.3",
    "fastapi>=0.100.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "pydantic>=2.0.0",
    "pyiceberg>=0.11.1",
    "requests>=2.31.0",
    "rich>=14.3.4",
    "streamlit>=1.30.0",
    "textual>=8.2.7",
    "uvicorn>=0.23.0",
]

[project.scripts]
lakehouse-health-operator = "operator_tui:main"
lh = "operator_tui:main"

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "ruff>=0.11.0",
]

[dependency-groups]
dev = [
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "ruff>=0.11.0",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.hatch.build.targets.wheel]
packages = [
    "src/analysis",
    "src/analyzers",
    "src/catalogs",
    "src/configuration",
    "src/operator_cache",
    "src/operator_tui",
    "src/report_exports",
    "src/workflows",
    "src/visualization",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["analyzers", "catalogs", "operator_cache", "operator_tui", "report_exports", "visualization", "workflows", "utils"]

[tool.pytest.ini_options]
pythonpath = [".", "src"] 
